
name: Minecraft 1.7.10 Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0,6,12,18 * * *'

permissions:
  contents: read

concurrency:
  group: minecraft-1710-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    env:
      MC_HOST: ${{ secrets.MC_HOST }}
      MC_USERNAME: ${{ secrets.MC_USERNAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install --no-audit --no-fund \
            minecraft-protocol@latest \
            minecraft-protocol-forge@latest

      - name: Patch legacy Forge handshake
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          let dir = path.dirname(
            require.resolve('minecraft-protocol-forge')
          );

          let root;

          while (true) {
            const manifest = path.join(dir, 'package.json');

            if (fs.existsSync(manifest)) {
              try {
                const pkg = JSON.parse(
                  fs.readFileSync(manifest, 'utf8')
                );

                if (pkg.name === 'minecraft-protocol-forge') {
                  root = dir;
                  break;
                }
              } catch (_) {}
            }

            const parent = path.dirname(dir);

            if (parent === dir) {
              throw new Error(
                'Could not locate minecraft-protocol-forge package.'
              );
            }

            dir = parent;
          }

          const file = path.join(
            root,
            'src',
            'client',
            'forgeHandshake.js'
          );

          let source = fs.readFileSync(file, 'utf8');

          const statePattern =
            /(case\s+FMLHandshakeClientState\.WAITINGSERVERCOMPLETE:\s*\{)/;

          if (!statePattern.test(source)) {
            throw new Error(
              'Could not locate WAITINGSERVERCOMPLETE in Forge source.'
            );
          }

          if (!source.includes('PATCH_1710_ACK_PHASE2')) {
            const patch = [
              '',
              '      // PATCH_1710_ACK_PHASE2',
              "      if (client.version === '1.7.10' && parsed.data.discriminator === 'HandshakeAck' && parsed.data.phase === 2) {",
              "        debug('1.7.10 compatibility: received HandshakeAck phase 2');",
              '        writeAck(client, FMLHandshakeClientState.WAITINGSERVERCOMPLETE);',
              '        client.fmlHandshakeState = FMLHandshakeClientState.PENDINGCOMPLETE;',
              '        break;',
              '      }',
              ''
            ].join('\n');

            source = source.replace(
              statePattern,
              match => match + patch
            );
          }

          const listenerPattern =
            /if \(packet\.channel === 'FML\|HS'\) \{\s*fmlHandshakeStep\(client, packet\.data, options\)\s*\}/;

          if (listenerPattern.test(source)) {
            const replacement = [
              "if (packet.channel === 'FML|HS') {",
              '  try {',
              '    fmlHandshakeStep(client, packet.data, options)',
              '  } catch (error) {',
              "    console.error('Forge handshake failed:', error.message)",
              "    client.end('Forge handshake failed')",
              '  }',
              '}'
            ].join('\n');

            source = source.replace(
              listenerPattern,
              replacement
            );
          } else if (!source.includes('Forge handshake failed:')) {
            throw new Error(
              'Could not locate Forge handshake listener.'
            );
          }

          fs.writeFileSync(file, source);

          console.log('Legacy Forge handshake patch applied.');
          console.log('Patched file: ' + file);
          NODE

      - name: Run bot
        run: node bot.js
