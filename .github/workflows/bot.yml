name: Minecraft Bot

on:
  workflow_dispatch:          # start manually from the Actions tab
  schedule:
    - cron: '*/10 * * * *'    # every 10 min: starts the bot if it is not running.
                              # If the server is down the bot exits right away,
                              # and the next check starts it again.

# Only one bot at a time (the same username would kick itself).
# A new scheduled run waits in the queue until the running one finishes,
# so when the bot hands over at ~5h45m the next one takes over at once.
concurrency:
  group: minecraft-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350      # GitHub's hard limit is 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run bot
        env:
          MC_HOST: ${{ secrets.MC_HOST }}
          MC_PORT: ${{ secrets.MC_PORT }}
          MC_USERNAME: ${{ secrets.MC_USERNAME }}
          # Optional (Settings > Secrets and variables > Actions > Variables). Leave unset normally.
          MC_DEBUG: ${{ vars.MC_DEBUG }}         # "true" = print every packet problem
          MC_PROTOCOL: ${{ vars.MC_PROTOCOL }}   # default 777 (Minecraft 26.3)
        run: node bot.js
